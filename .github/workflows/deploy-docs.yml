---
name: Deploy Developer Docs

# Builds the Docusaurus site in developer_docs/ and publishes it to GitHub Pages at
# https://polymathrobotics.github.io/lidar_eval_framework/
#
# Uses the GitHub Pages Actions flow (upload-pages-artifact + deploy-pages) rather than
# pushing to a gh-pages branch, so no deploy key or PAT is needed — the job's OIDC token
# is enough for deploying. But the Pages site itself must exist first, and creating one is
# an admin-only API that GITHUB_TOKEN cannot call. So this is a one-time manual step:
#   Settings > Pages > Build and deployment > Source = "GitHub Actions"
# Until that is done, configure-pages fails with "Get Pages site failed ... Not Found".

on:
  push:
    branches: [main]
    # Only rebuild when the docs actually change.
    paths:
      - 'developer_docs/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

# Least privilege: read the repo, write Pages, and mint the OIDC token deploy-pages needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling so a merged PR always lands.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: developer_docs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: developer_docs/package-lock.json

      # `npm ci` (not `install`) so the build uses the committed lockfile exactly.
      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      # No `enablement: true` here: creating a Pages site needs repo-admin rights, which
      # GITHUB_TOKEN lacks even with `pages: write` ("Resource not accessible by
      # integration"). The site must be enabled once in the UI — see the header comment.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: developer_docs/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
