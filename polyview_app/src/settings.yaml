plot_y_padding: 0.3
secondary_axis_keys:
- rough_n
- point_count
- dropout_cell_count
- total_cell_count
category_skip_key_suffixes:
  ZoneSurfaceDepthError:
    - _pct
  NearestNeighbourSpacing:
    - nn_outlier_frac

split_by_suffix_categories:
- TemporalConsistency
- SurfaceFitResidual
- RangePrecision
- RangeDistributionHealth
split_exclude_suffixes:
  RangePrecision:
  - mean
  TemporalConsistency:
  - mean
  RangeDistributionHealth:
  - min
  - max
  - p10
  - p50
  - p90
  - p99
  - mean
  - expected
thresholdable_metrics:
- "RangeDistributionHealth \xB7 std"
- LocalRoughnessKNN
- NearestNeighbourSpacing
- RangePrecision
- TemporalConsistency
- ZoneSurfaceDepthError
- "SurfaceFitResidual \xB7 rms"
- "SurfaceFitResidual \xB7 offset"
- SpatialDropout
- PointYieldPerZone
thresholds:
  LocalRoughnessKNN:
    bad_1:
      enabled: true
      label: Noisy
      max: 0.9
      min: 0.008
    bad_2:
      enabled: false
      label: ''
      max: 0.0
      min: 0.0
    great:
