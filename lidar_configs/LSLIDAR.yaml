# LSLIDAR (LeiShen LS-series, LSS3/LSS4) LiDAR configuration for the polymath lidar test bench.

# Add a field that gives distance between motor axis and map
# fuck the cart frame
# in configure new run, take the field and put it in lidar zones config
# in urdf generator construct link between motor axis and map [fuck the cart]

lidar:
  # ── Identity ──────────────────────────────────────────────────────────────
  frame:               laser_link      # TF frame / URDF link name
  folder:              LSLIDAR         # Results folder and Notion identifier
  point_cloud_topic:   /lslidar_point_cloud



  # need to change below

  # ── Mount pose (lidar_joint in lidar_bench.urdf) ──────────────────────────
  joint_xyz_m:         [0.0, 0.0, 0.05]    # offset from motor_axis (m)
  joint_rpy_rad:       [0.0, 0.0, -1.5708]     # yaw -90deg: sensor (x-right, y-fwd) -> ROS (x-fwd, y-left)

  # ── Bench geometry ────────────────────────────────────────────────────────
  map_to_motor_height_m:   0.9406   # vertical distance, ground (map) -> motor_axis (m)
  motor_to_lidar_height_m: 0.1016   # vertical distance, motor_axis -> lidar (m)

  # ── Driver ────────────────────────────────────────────────────────────────
  ros2_driver:         lslidar_driver
  driver_command:      'ros2 run lslidar_driver lslidar_driver_node --ros-args --params-file /lidar_test_bench/lidar_drivers/Lslidar_ROS2_driver/lslidar_driver/config/lslidar_ls.yaml'
  driver_config_file:  '/lidar_test_bench/lidar_drivers/Lslidar_ROS2_driver/lslidar_driver/config/lslidar_ls.yaml'
  lidar_gui:           ''                                    # empty disables GUI prompt

  # eventually remove the bottom two angles completely


  # ── Sweep ─────────────────────────────────────────────────────────────────
  angles:              [10.0, -7.0]                         # servo angles to sweep (deg)
  parameter_names:     [min_range, max_range, scan_start_angle, scan_end_angle]



  # -- Include parameters specific to lidar
  horizontal_fov_deg: 120.0
  vertical_fov_deg: 22.5
  horizontal_resolution_deg: 0.129
  vertical_resolution_deg: 0.11
  cost: 999.0

  # TODO: 1. Use horizontal fov and vertical fov to compute panning and tilting angles
  #       2. Use the resolutions for both in degrees + geometry to compute distance
  #       3. maybe attach a link to an image here somewhere
  #       4. sen the cost, vertical and horizontal fov's, and the image somehow to the front lines


  # LS driver param names (lslidar_ls_driver.cpp). Paths target the /**:ros__parameters block
  # in lslidar_config.yaml, which the bench rewrites in place per sweep case.

  # Minimum point distance — clips returns closer than this (meters).
  # Target is at ~5 m, so these only trim near self-occlusion; none remove the target.
  min_range:
    type:    double
    default: 0.15
    values:  [0.15, 0.5, 1.0]
    path:    /**.ros__parameters.min_range
    description: Minimum range threshold in meters. Returns closer than this value are filtered out to prevent self-occlusion from the sensor housing or mount.

  # Maximum point distance — clips returns farther than this (meters).
  # Target at ~5 m: 6 m is a tight cutoff just past it, 50 m is effectively full range.
  max_range:
    type:    double
    default: 50.0
    values:  [6.0, 10.0, 50.0]
    path:    /**.ros__parameters.max_range
    description: Maximum range threshold in meters. Filters out distant returns; at a 5 m target this brackets the cutoff from just-past-target to full range.

  # Horizontal FOV trim — start azimuth, units of 0.01 deg (full LS FOV is -6000..6000 = +/-60 deg).
  # At 5 m, +/-15 deg (-1500) still retains a ~2.6 m-wide centered target.
  scan_start_angle:
    type:    int
    default: -6000
    values:  [-6000, -3000, -1500]
    path:    /**.ros__parameters.scan_start_angle
    description: Start azimuth of the horizontal FOV window in 0.01 deg units (-6000 = -60 deg). Sweeps progressively narrow the left edge of the scanning sector.

  # Horizontal FOV trim — end azimuth, units of 0.01 deg.
  scan_end_angle:
    type:    int
    default: 6000
    values:  [6000, 3000, 1500]
    path:    /**.ros__parameters.scan_end_angle
    description: End azimuth of the horizontal FOV window in 0.01 deg units (6000 = 60 deg). Sweeps progressively narrow the right edge of the scanning sector.
