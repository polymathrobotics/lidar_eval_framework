# Maps color names to RGB ranges for ROI zone color matching
# Matching uses Euclidean distance to the midpoint of each range

color_map:
  - name: white
    rgb_min: [200, 200, 200]
    rgb_max: [255, 255, 255]

  - name: green
    rgb_min: [0, 150, 0]
    rgb_max: [100, 255, 100]

  - name: turquoise
    rgb_min: [0, 180, 180]
    rgb_max: [100, 255, 230]

  - name: grey
    rgb_min: [80, 80, 80]
    rgb_max: [180, 180, 180]

  - name: black
    rgb_min: [0, 0, 0]
    rgb_max: [50, 50, 50]

  - name: red
    rgb_min: [150, 0, 0]
    rgb_max: [255, 80, 80]

  - name: blue
    rgb_min: [0, 0, 150]
    rgb_max: [80, 80, 255]

  - name: yellow
    rgb_min: [200, 200, 0]
    rgb_max: [255, 255, 100]
